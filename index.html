<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9551's Linux Cheatsheet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="prism.min.css" rel="stylesheet" />

    <style>
        :root {
            --bg-color: #000000;
            --pre-bg: #000000;
            --text-color: #ffffff;
            --input-bg: #050505;
            --input-border: #1a1a1a;
            --input-focus: #58a6ff;
            --badge-bg: #0a0a0a;
            --badge-border: #1a1a1a;
            --badge-text: #8be9fd;
            --highlight-bg: rgba(88, 166, 255, 0.12);
            --scrollbar-thumb: #222222;
        }

        @font-face {
            font-family: "Fira Code";
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url("fonts/FiraCode-Medium.woff2") format("woff2");
        }

        @font-face {
            font-family: "Fira Code";
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url("fonts/FiraCode-Bold.woff2") format("woff2");
        }

        body.theme_normal {
            --bg-color: #0f1117;
            --pre-bg: #111418;
            --text-color: #e6edf3;
            --input-bg: #161b22;
            --input-border: #30363d;
            --badge-bg: #161b22;
            --badge-border: #30363d;
            --scrollbar-thumb: #30363d;
            --highlight-bg: rgba(88, 166, 255, 0.15);
        }

        body.theme_light {
            --bg-color: #ffffff;
            --pre-bg: #ffffff;
            --text-color: #1f2328;
            --input-bg: #ffffff;
            --input-border: #d0d7de;
            --input-focus: #0969da;
            --badge-bg: #f6f8fa;
            --badge-border: #d0d7de;
            --badge-text: #0969da;
            --highlight-bg: rgba(9, 105, 218, 0.08);
            --scrollbar-thumb: #d0d7de;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 24px 15px 24px 20px;
        }

        .header {
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 0 5px 0 0;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header_left {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            line-height: 1;
        }

        .title_link {
            color: inherit;
            text-decoration: none;
        }
        .title_link:hover {
            text-decoration: underline;
        }

        .subname {
            font-size: 11px;
            font-family: "Fira Code", monospace;
            color: #8b949e;
            opacity: 0.8;
        }

        body.theme_light .subname {
            color: #57606a;
        }

        #search_box {
            padding: 12px 16px;
            width: 320px;
            max-width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            font-family: "Fira Code", monospace;
            font-size: 13px;
            outline: none;
            border-radius: 0;
            font-variant-ligatures: none;
            box-sizing: border-box;
        }
        #search_box:focus {
            border-color: var(--input-focus);
        }

        .theme_toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-family: "Fira Code", monospace;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
            opacity: 0.6;
            text-transform: lowercase;
            border-radius: 0;
        }
        .theme_toggle:hover {
            opacity: 1;
            background-color: var(--input-border);
        }

        .wrapper_container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: auto;
            box-sizing: border-box;
        }

        .container {
            width: max-content;
            min-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        pre[class*="language-"] {
            background-color: var(--pre-bg) !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 4px 5px 4px 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            overflow: visible !important;
            white-space: pre !important;
            word-wrap: normal !important;
        }

        code[class*="language-"] {
            font-family: "Fira Code", monospace;
            font-weight: 500;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-color) !important;
            text-shadow: none !important;
            white-space: pre !important;
            background: none !important;
            display: table;
            width: 100%;
            font-variant-ligatures: none !important;
            font-feature-settings: "liga" 0 !important;
        }

        .code_line {
            display: table-row;
        }

        .code_line.category_spacer .code_content,
        .code_line.category_spacer .category_badge_container {
            padding-top: 1.8em;
        }

        .code_line.hidden {
            display: none !important;
        }

        .code_line.highlight_match {
            background-color: var(--highlight-bg);
        }

        .code_line.dimmed_match {
            background-color: rgba(255, 255, 255, 0.02);
            opacity: 0.4;
        }

        body.theme_light .code_line.dimmed_match {
            background-color: rgba(0, 0, 0, 0.02);
            opacity: 0.5;
        }

        .code_content {
            display: table-cell;
            white-space: pre;
            padding-right: 40px;
        }

        .category_badge_container {
            display: table-cell;
            vertical-align: middle;
            text-align: left;
            width: 100%;
        }

        .category_badge {
            display: none;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            padding: 2px 8px;
            font-size: 10px;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            border-radius: 0;
        }

        body.filtering .category_badge {
            display: inline-block;
        }

        .bracket_content {
            color: #8b949e !important;
            background: none !important;
        }

        .hash_bracket_content {
            color: #7ee787 !important;
            background: none !important;
        }

        body.theme_light .bracket_content {
            color: #57606a !important;
            background: none !important;
        }

        body.theme_light .hash_bracket_content {
            color: #1a7f37 !important;
            background: none !important;
        }

        body.theme_light .token.comment,
        body.theme_light .token.block-comment,
        body.theme_light .token.prolog,
        body.theme_light .token.doctype,
        body.theme_light .token.cdata { color: #57606a !important; font-style: italic; background: none !important; }

        body.theme_light .token.punctuation { color: #0550ae !important; background: none !important; }

        body.theme_light .token.property,
        body.theme_light .token.tag,
        body.theme_light .token.boolean,
        body.theme_light .token.number,
        body.theme_light .token.constant,
        body.theme_light .token.symbol,
        body.theme_light .token.deleted { color: #0550ae !important; background: none !important; }

        body.theme_light .token.selector,
        body.theme_light .token.attr-name,
        body.theme_light .token.string,
        body.theme_light .token.char,
        body.theme_light .token.builtin,
        body.theme_light .token.inserted { color: #0a3069 !important; background: none !important; }

        body.theme_light .token.operator,
        body.theme_light .token.entity,
        body.theme_light .token.url,
        body.theme_light .language-css .token.string,
        body.theme_light .style .token.string { color: #cf222e !important; background: none !important; }

        body.theme_light .token.atrule,
        body.theme_light .token.attr-value,
        body.theme_light .token.keyword { color: #cf222e !important; font-weight: bold; background: none !important; }

        body.theme_light .token.function,
        body.theme_light .token.class-name { color: #8250df !important; background: none !important; }

        body.theme_light .token.regex,
        body.theme_light .token.important,
        body.theme_light .token.variable { color: #953800 !important; background: none !important; }

        ::selection,
        ::-moz-selection,
        *::selection,
        pre[class*="language-"] ::selection,
        code[class*="language-"] ::selection,
        span::selection,
        .bracket_content::selection,
        .hash_bracket_content::selection,
        .token::selection {
            background-color: #21374b !important;
            color: #e6edf3 !important;
            text-shadow: none !important;
        }

        body.theme_light ::selection,
        body.theme_light ::-moz-selection,
        body.theme_light *::selection,
        body.theme_light pre[class*="language-"] ::selection,
        body.theme_light code[class*="language-"] ::selection,
        body.theme_light span::selection,
        body.theme_light .bracket_content::selection,
        body.theme_light .hash_bracket_content::selection,
        body.theme_light .token::selection {
            background-color: #c8e1ff !important;
            color: #1f2328 !important;
            text-shadow: none !important;
        }

        .token.comment,
        .token.block-comment,
        .token.prolog,
        .token.doctype,
        .token.cdata { color: #8b949e !important; font-style: italic; background: none !important; }

        .token.punctuation { color: #d2a8ff !important; background: none !important; }

        .token.property,
        .token.tag,
        .token.boolean,
        .token.number,
        .token.constant,
        .token.symbol,
        .token.deleted { color: #79c0ff !important; background: none !important; }

        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted { color: #a5d6ff !important; background: none !important; }

        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string { color: #ff7b72 !important; background: none !important; }

        .token.atrule,
        .token.attr-value,
        .token.keyword { color: #ff7b72 !important; font-weight: bold; background: none !important; }

        .token.function,
        .token.class-name { color: #d2a8ff !important; background: none !important; }

        .token.regex,
        .token.important,
        .token.variable { color: #ffa657 !important; background: none !important; }

        ::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 0;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--input-border);
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            #search_box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header_left">
            <div class="header_left">
                <h1><a href="./cheatsheet.txt" class="title_link">9551's Linux Cheatsheet</a></h1>
                <span class="subname">(Arch)</span>
            </div>
            <button id="theme_toggle_btn" class="theme_toggle">theme: black</button>
        </div>
        <input type="text" id="search_box" placeholder="Filter commands..." autocomplete="off">
    </div>

    <div class="wrapper_container">
        <div class="container">
            <pre><code id="cheatsheet_code" class="language-markdown">Loading cheatsheet...</code></pre>
        </div>
    </div>

    <script src="prism.min.js"></script>
    <script src="prism-markdown.min.js"></script>

    <script>
        const themes = ["black", "normal", "light"];
        let current_theme = localStorage.getItem("cheatsheet_theme") || "black";

        function apply_theme(theme_name) {
            document.body.classList.remove("theme_normal", "theme_light");
            if (theme_name === "normal") {
                document.body.classList.add("theme_normal");
            } else if (theme_name === "light") {
                document.body.classList.add("theme_light");
            }
            document.getElementById("theme_toggle_btn").textContent = "theme: " + theme_name;
            localStorage.setItem("cheatsheet_theme", theme_name);
        }

        apply_theme(current_theme);

        document.getElementById("theme_toggle_btn").addEventListener("click", () => {
            let next_index = (themes.indexOf(current_theme) + 1) % themes.length;
            current_theme = themes[next_index];
            apply_theme(current_theme);
        });

        function update_url_query(query) {
            const url = new URL(window.location);
            if (query) {
                url.searchParams.set("q", query);
            } else {
                url.searchParams.delete("q");
            }
            window.history.replaceState({}, "", url);
        }

        async function fetch_with_retries(url, retries = 3, delay = 1000) {
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return await response.text();
                } catch (error) {
                    console.warn(`Fetch attempt ${attempt} failed: ${error.message}`);
                    if (attempt === retries) {
                        throw new Error(`Failed to load ${url} after ${retries} attempts.`);
                    }
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, attempt - 1)));
                }
            }
        }

        fetch_with_retries("cheatsheet.txt", 3, 1000)
            .then(text => {
                const code_element = document.getElementById("cheatsheet_code");
                const raw_lines = text.split("\n");

                let current_category = "General";
                const line_categories = [];
                const line_data = [];
                let processed_lines = [];

                raw_lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith("# ===")) {
                        current_category = trimmed.replace(/^#+\s*===\s*|\s*===.*$/g, "").trim();
                    }

                    line_categories.push(current_category);
                    line_data.push({
                        index: processed_lines.length,
                        text: line.toLowerCase(),
                        is_header: trimmed.startsWith("# ==="),
                        is_spacer: false
                    });
                    processed_lines.push(line);

                    line_categories.push(current_category);
                    line_data.push({
                        index: processed_lines.length,
                        text: "",
                        is_header: false,
                        is_spacer: true
                    });
                    processed_lines.push("");
                });

                const final_text = processed_lines.join("\n");
                code_element.textContent = final_text;
                Prism.highlightElement(code_element);

                const html_lines = code_element.innerHTML.split("\n");
                code_element.innerHTML = "";

                const line_elements = [];

                html_lines.forEach((line_html, index) => {
                    const cat = line_categories[index];
                    const trimmed_line = processed_lines[index].trim();
                    const is_header_line = trimmed_line.startsWith("# ===");

                    let processed_html = line_html
                        .replace(/(\[#?[^\]]*\])/g, (match) => {
                            if (match.startsWith("[#")) {
                                return `<span class="hash_bracket_content">${match}</span>`;
                            }
                            return `<span class="bracket_content">${match}</span>`;
                        });

                    const span = document.createElement("span");
                    span.id = "line-" + (index + 1);
                    span.className = "code_line";
                    span.setAttribute("data-index", index);

                    if (is_header_line && index > 0) {
                        span.classList.add("category_spacer");
                    }

                    span.innerHTML = `<span class="code_content">${processed_html}</span><span class="category_badge_container"><span class="category_badge">${cat}</span></span>`;
                    code_element.appendChild(span);
                    line_elements.push(span);
                });

                // normalization pre-proc
                const preprocessed_targets = line_data.map(item => {
                    if (item.is_header || item.is_spacer || !item.text.trim()) {
                        return { norm_target: "", command_part: "", desc_part: "", is_path: false, target_words: [] };
                    }

                    const norm_target = item.text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/y/g, "i").replace(/(.)\1{2,}/g, "$1$1");

                    let command_part = norm_target;
                    let desc_part = "";
                    const comment_idx = norm_target.indexOf("#");
                    if (comment_idx !== -1) {
                        command_part = norm_target.slice(0, comment_idx).trim();
                        desc_part = norm_target.slice(comment_idx + 1).replace(/^\[#.*?\]\s*/, "").trim();
                    }

                    const is_path = command_part.startsWith("/") || command_part.startsWith("~/") || command_part.startsWith("$");
                    const target_words = norm_target.split(/[\s/._,-]+/).filter(Boolean);

                    return {
                        norm_target,
                        command_part,
                        desc_part,
                        is_path,
                        target_words
                    };
                });

                function get_match_score(query, targetObj, original_index = -1) {
                    if (!query || !query.trim() || !targetObj.norm_target) return -1000;

                    const norm_query = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/y/g, "i").replace(/(.)\1{2,}/g, "$1$1");
                    if (norm_query === targetObj.norm_target) return 5000;

                    const { command_part, desc_part, is_path, target_words, norm_target } = targetObj;
                    const target_penalty = is_path ? 400 : 0;
                    const query_tokens = norm_query.split(/[\s/_-]+/).filter(Boolean);

                    let short_command_penalty = 0;
                    if (query_tokens.length > 1 && command_part.length <= 3) {
                        const is_command_explicitly_typed = query_tokens[0] === command_part || norm_query.startsWith(command_part + " ");
                        if (!is_command_explicitly_typed) {
                            short_command_penalty = 1500;
                        }
                    }

                    let length_mismatch_penalty = 0;
                    if (norm_query.length > command_part.length + 3) {
                        length_mismatch_penalty = (norm_query.length - command_part.length) * 35;
                    }

                    let base_score = 0;

                    // Strategy 1: Command start match
                    if (command_part.startsWith(norm_query)) {
                        let root_bonus = (norm_query === "/") ? 1000 : 0;
                        const next_char = command_part[norm_query.length];
                        const is_clean_boundary = !next_char || /[\s/<#._-]/.test(next_char);
                        let boundary_bonus = is_clean_boundary ? 300 : 0;

                        base_score = Math.max(base_score, 2800 + (norm_query.length * 20) + root_bonus + boundary_bonus);
                    }

                    // Strategy 2: Exact phrase match
                    const exact_phrase_idx = norm_target.indexOf(norm_query);
                    if (exact_phrase_idx !== -1) {
                        let position_penalty = exact_phrase_idx * 1.5;
                        let start_bonus = (exact_phrase_idx === 0) ? 300 : 0;

                        const match_end_idx = exact_phrase_idx + norm_query.length;
                        const next_char = norm_target[match_end_idx];
                        const is_clean_boundary = (match_end_idx === norm_target.length) || /[\s/<#._-]/.test(next_char);
                        let boundary_bonus = is_clean_boundary ? 400 : 0;

                        let desc_bonus = 0;
                        if (desc_part.length > 0) {
                            const desc_match_idx = desc_part.indexOf(norm_query);
                            if (desc_match_idx !== -1) {
                                const is_desc_word_start = desc_match_idx === 0 || /[\s/._-]/.test(desc_part[desc_match_idx - 1]);
                                if (is_desc_word_start) {
                                    desc_bonus = (desc_match_idx === 0) ? 600 : Math.max(0, 300 - (desc_match_idx * 2));
                                }
                            }
                        }

                        let phrase_score = 2000 + start_bonus + boundary_bonus - position_penalty + desc_bonus;
                        if (norm_query.length > 2 || is_clean_boundary) {
                            base_score = Math.max(base_score, phrase_score);
                        }
                    }

                    // Strategy 3: Token & fuzzy matching
                    if (/^[\s/_-]+$/.test(query)) {
                        if (command_part.startsWith(norm_query)) {
                            let leading_symbol_bonus = (command_part === "/") ? 5000 : 4000;
                            base_score = Math.max(base_score, leading_symbol_bonus);
                        } else if (command_part.includes(norm_query)) {
                            base_score = Math.max(base_score, 500);
                        } else {
                            base_score = 0;
                        }
                    } else {
                        if (query_tokens.length > 0) {
                            let token_score = 0;
                            let matched_tokens_count = 0;
                            let earliest_match_idx = Infinity;
                            let last_token_end_idx = -1;
                            let full_word_matches_count = 0;

                            for (const token of query_tokens) {
                                const match_idx = norm_target.indexOf(token);
                                const is_word_prefix = target_words.some(w => w.startsWith(token));
                                const is_exact_word = target_words.includes(token);

                                if (match_idx !== -1 || is_word_prefix) {
                                    matched_tokens_count++;

                                    const effective_match_idx = match_idx !== -1 ? match_idx : norm_target.indexOf(token);
                                    earliest_match_idx = Math.min(earliest_match_idx, effective_match_idx);

                                    let order_bonus = (last_token_end_idx !== -1 && effective_match_idx >= last_token_end_idx) ? 100 : 0;
                                    let word_bonus = 0;

                                    if (is_exact_word) {
                                        word_bonus = 300;
                                        full_word_matches_count++;
                                    } else if (is_word_prefix) {
                                        word_bonus = 240;
                                        full_word_matches_count++;
                                    } else {
                                        word_bonus = 80;
                                    }

                                    let position_penalty = effective_match_idx * 1.5;
                                    let score = 300 + (token.length * 20) + word_bonus + order_bonus - position_penalty;
                                    token_score += Math.max(score, 50);
                                    last_token_end_idx = effective_match_idx + token.length;
                                    continue;
                                }

                                let q_idx = 0;
                                let t_idx = 0;
                                let score = 0;
                                let consecutive = 0;
                                let first_match_idx = -1;

                                while (q_idx < token.length && t_idx < norm_target.length) {
                                    if (token[q_idx] === norm_target[t_idx]) {
                                        if (first_match_idx === -1) first_match_idx = t_idx;
                                        consecutive++;
                                        let boundary_bonus = (t_idx === 0 || /[\s/._-]/.test(norm_target[t_idx - 1])) ? 30 : 0;
                                        score += 15 + (consecutive * 10) + boundary_bonus;
                                        q_idx++;
                                    } else {
                                        consecutive = 0;
                                        score -= 3;
                                    }
                                    t_idx++;
                                }

                                if (q_idx >= token.length) {
                                    matched_tokens_count++;
                                    score -= first_match_idx * 1.5;
                                    earliest_match_idx = Math.min(earliest_match_idx, first_match_idx);
                                    token_score += Math.max(score, 10);
                                }
                            }

                            if (matched_tokens_count > 0) {
                                let match_ratio_multiplier = Math.pow(matched_tokens_count / query_tokens.length, 1.2);
                                let multi_word_completeness_bonus = (full_word_matches_count > 1) ? (full_word_matches_count * 800) : 0;

                                if (earliest_match_idx !== Infinity) {
                                    token_score += Math.max(0, 150 - (earliest_match_idx * 3));
                                }

                                base_score = Math.max(base_score, Math.round((token_score + multi_word_completeness_bonus) * match_ratio_multiplier));
                            }
                        }
                    }

                    let final_score = base_score - target_penalty - length_mismatch_penalty - short_command_penalty;

                    if (typeof original_index === "number" && original_index >= 0) {
                        final_score -= (original_index * 1.5);
                    }

                    return Math.round(final_score);
                }

                const search_box = document.getElementById("search_box");
                const body_element = document.body;
                const pre_element = code_element.closest("pre");
                const wrapper_container = document.querySelector(".wrapper_container");

                function perform_search(raw_query) {
                    const query = raw_query.toLowerCase().trim();

                    if (query !== "") {
                        body_element.classList.add("filtering");
                    } else {
                        body_element.classList.remove("filtering");
                    }

                    const parent = pre_element.parentNode;
                    parent.removeChild(pre_element);

                    if (query === "") {
                        line_data.forEach(item => {
                            const el = line_elements[item.index];
                            el.classList.remove("hidden");
                            el.classList.remove("highlight_match");
                            el.classList.remove("dimmed_match");
                            code_element.appendChild(el);
                        });
                    } else {
                        const scored_lines = line_data.map((item, index) => {
                            if (item.is_header || item.is_spacer) return { item, score: -1000 };
                            const targetObj = preprocessed_targets[index];
                            const score = get_match_score(query, targetObj, index);
                            return { item, score };
                        });

                        scored_lines.sort((a, b) => b.score - a.score);

                        const fragment = document.createDocumentFragment();

                        scored_lines.forEach(({ item, score }) => {
                            const el = line_elements[item.index];
                            if (score >= -500) {
                                el.classList.remove("hidden");

                                if (score > -50) {
                                    el.classList.add("highlight_match");
                                    el.classList.remove("dimmed_match");
                                } else {
                                    el.classList.remove("highlight_match");
                                    el.classList.add("dimmed_match");
                                }

                                fragment.appendChild(el);
                            } else {
                                el.classList.add("hidden");
                                el.classList.remove("highlight_match");
                                el.classList.remove("dimmed_match");
                            }
                        });

                        code_element.innerHTML = "";
                        code_element.appendChild(fragment);
                    }

                    parent.appendChild(pre_element);

                    code_element.scrollTop = 0;
                    pre_element.scrollTop = 0;

                    if (wrapper_container) wrapper_container.scrollTop = 0;

                    window.scrollTo({ top: 0, behavior: "smooth" });
                }

                let search_timeout = null;
                search_box.addEventListener("input", (e) => {
                    const query = e.target.value;
                    clearTimeout(search_timeout);
                    search_timeout = setTimeout(() => {
                        if (typeof update_url_query === "function") {
                            update_url_query(query.toLowerCase().trim());
                        }
                        perform_search(query);
                    }, 150);
                });

                const url_params = new URLSearchParams(window.location.search);
                const initial_query = url_params.get("q") || url_params.get("search") || "";
                if (initial_query !== "") {
                    perform_search(initial_query);
                }
            })
            .catch(error => {
                console.error(error);
                document.getElementById("cheatsheet_code").textContent = "Failed to load cheatsheet.";
            });
    </script>
</body>
